name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Web App Artifact
      run: |
        echo "Preparing web assets for AlphaQuant Pro..."
        mkdir -p www
        cp -r * www/ 2>/dev/null || true

    - name: Build with Cordova/Capacitor stub or Zip package
      run: |
        echo "Generating standalone mobile bundle structure..."
        ls -la
